# <!-- Powered by BMAD™ Core -->
template:
  id: trend-analysis-template
  name: Trend Analysis Template
  version: 1.0
  output:
    format: markdown
    filename: docs/trend-analysis-{{analysis_subject}}.md
    title: "Trend Analysis: {{analysis_subject}}"

workflow:
  mode: interactive
  elicitation: advanced-elicitation

sections:
  - id: executive_summary
    title: Executive Summary
    instruction: Overview of key trends and their significance
    template: |
      # Trend Analysis: {{analysis_subject}}

      **Analysis Period:** {{analysis_period}}

      **Date of Analysis:** {{current_date}}

      ## Executive Summary

      {{key_trends_summary}}

      **Significance:** {{trend_significance}}

      **Confidence Level:** {{confidence_level}}
  - id: methodology
    title: Analysis Methodology
    instruction: Methods and data sources used for trend identification
    template: |
      ## Methodology

      ### Data and Methods
      **Data Sources:** {{data_sources}}

      **Analysis Methods:** {{analysis_methods}}

      **Time Period:** {{time_period_selection}}

      **Measurement Criteria:** {{measurement_criteria}}

      **Limitations:** {{methodology_limitations}}
  - id: baseline_establishment
    title: Baseline and Historical Context
    instruction: Foundation period and historical reference points
    template: |
      ## Baseline and Historical Context

      **Baseline Period:** {{baseline_period}}

      **Baseline Conditions:** {{baseline_conditions}}

      **Contextual Factors:** {{contextual_factors}}

      {{#if historical_precedents}}
      **Historical Precedents:** {{historical_precedents}}
      {{/if}}
  - id: primary_trends
    title: Primary Trends Identified
    instruction: Main directional patterns and their characteristics
    template: |
      ## Primary Trends Identified

      ### Trend 1
      {{trend_one}}

      **Supporting Evidence:** {{trend_one_evidence}}

      {{#if trend_two}}
      ### Trend 2
      {{trend_two}}

      **Supporting Evidence:** {{trend_two_evidence}}
      {{/if}}

      {{#if trend_three}}
      ### Trend 3
      {{trend_three}}

      **Supporting Evidence:** {{trend_three_evidence}}
      {{/if}}
  - id: trend_dynamics
    title: Trend Dynamics and Relationships
    instruction: How trends interact, accelerate, or influence each other
