      ### Trend Interactions
      {{trend_interactions}}

      ### Acceleration Factors
      {{acceleration_factors}}

      ### Deceleration Factors
      {{deceleration_factors}}

      {{#if cyclical_patterns}}
      ### Cyclical Patterns
      {{cyclical_patterns}}
      {{/if}}
  - id: driving_forces
    title: Driving Forces and Influences
    instruction: Underlying causes and factors driving the observed trends
    template: |
      ## Driving Forces and Influences

      ### Primary Drivers
      {{primary_drivers}}

