# <!-- Powered by BMAD™ Core -->
template:
  id: source-analysis-report
  name: Source Analysis Report
  version: 1.0
  output:
    format: markdown
    filename: docs/source-analysis-{{source_description}}.md
    title: "Source Analysis Report: {{source_description}}"

workflow:
  mode: interactive
  elicitation: advanced-elicitation

sections:
  - id: executive_summary
    title: "Executive Summary"
    instruction: "Provide overview of source analysis"
    sections:
      - id: source_overview
        title: "Source Overview"
        template: |
          **Source:** {{source_description}}
          **Analysis Purpose:** {{analysis_purpose}}
          **Analysis Date:** [Date]
          **Overall Reliability Rating:** [High/Moderate/Low]

      - id: key_findings
        title: "Key Analysis Findings"
        template: |
          **Primary Strengths:** [Main reliability strengths]
          **Primary Concerns:** [Main reliability concerns]
          **Recommended Usage:** [How this source should be used]

  - id: source_identification
    title: "Source Identification and Classification"
    instruction: "Identify and classify the source type and characteristics"
    sections:
      - id: basic_information
        title: "Basic Source Information"
        template: |
          **Source Type:** [Primary/Secondary/Tertiary]
          **Publication Type:** [Book, journal, website, etc.]
          **Author(s):** [Author names and credentials]
          **Publication Date:** [Date of publication]
          **Publisher/Platform:** [Publishing organization or platform]

      - id: source_classification
        title: "Source Classification"
        template: |
          **Academic Status:** [Peer-reviewed, scholarly, popular, etc.]
          **Bias Orientation:** [Political, ideological, commercial, etc.]
          **Target Audience:** [Academic, professional, general public, etc.]
          **Geographic Scope:** [Local, national, international]
          **Temporal Relevance:** [Current, historical, ongoing relevance]

  - id: author_credibility
    title: "Author Credibility Assessment"
    instruction: "Evaluate the credibility and expertise of the author(s)"
    sections:
      - id: qualifications
        title: "Author Qualifications"
        template: |
          **Educational Background:** [Relevant education and degrees]
          **Professional Experience:** [Relevant work experience]
          **Subject Matter Expertise:** [Specific expertise in topic area]
          **Track Record:** [Previous publications and accuracy record]
          **Peer Recognition:** [Awards, citations, professional standing]

      - id: credibility_factors
        title: "Credibility Factors"
        template: |
          **Institutional Affiliation:** [Current institutional connections]
          **Financial Interests:** [Potential financial conflicts of interest]
          **Ideological Commitments:** [Strong ideological positions that might bias work]
          **Professional Reputation:** [Standing within relevant professional community]
          **Access to Information:** [Quality of access to relevant information and sources]

  - id: publication_assessment
    title: "Publication/Platform Assessment"
    instruction: "Evaluate the reliability and standards of the publication or platform"
    sections:
      - id: publication_credibility
        title: "Publication Credibility"
        template: |
          **Editorial Standards:** [Quality of editorial oversight and standards]
          **Peer Review Process:** [Peer review procedures if applicable]
          **Fact-Checking Practices:** [Fact-checking and verification procedures]
          **Correction Policies:** [Policies for corrections and retractions]
          **Professional Standing:** [Reputation within relevant field or industry]

      - id: bias_assessment
        title: "Publication Bias Assessment"
        template: |
          **Editorial Stance:** [Known editorial positions or biases]
          **Funding Sources:** [Sources of funding that might influence content]
          **Commercial Interests:** [Commercial relationships that might affect objectivity]
          **Political Affiliations:** [Political connections or orientations]
          **Audience Considerations:** [How target audience might influence content]

  - id: content_analysis
    title: "Content Quality Analysis"
    instruction: "Analyze the quality and reliability of the content itself"
    sections:
      - id: factual_accuracy
        title: "Factual Accuracy"
        template: |
          **Fact Verification:** [How well facts can be independently verified]
          **Source Attribution:** [Quality of source citation and attribution]
          **Evidence Quality:** [Strength and relevance of supporting evidence]
          **Data Integrity:** [Accuracy and appropriateness of statistical data]
          **Claim Verification:** [How well major claims can be corroborated]

      - id: methodological_rigor
        title: "Methodological Rigor"
        template: |
          **Research Methods:** [Quality of research methodology if applicable]
          **Sample Size/Scope:** [Appropriateness of sample or scope of investigation]
          **Control Measures:** [Controls for bias or confounding factors]
          **Transparency:** [Transparency of methods and limitations]
          **Reproducibility:** [Whether findings could be reproduced]

  - id: reliability_factors
    title: "Reliability Factors"
    instruction: "Assess specific factors that affect source reliability"
    sections:
      - id: timeliness_relevance
        title: "Timeliness and Relevance"
        template: |
          **Publication Currency:** [How current the information is]
          **Topic Relevance:** [Direct relevance to research topic]
          **Temporal Context:** [Whether time period affects reliability]
          **Update Frequency:** [How often source is updated or revised]
          **Obsolescence Risk:** [Risk of information becoming outdated]

      - id: consistency_corroboration
        title: "Consistency and Corroboration"
        template: |
          **Internal Consistency:** [Consistency within the source itself]
          **External Corroboration:** [Support from other independent sources]
          **Contradictory Evidence:** [Any contradictory information from reliable sources]
          **Consensus Level:** [Level of expert consensus on the topic]
          **Controversial Elements:** [Any controversial claims that require additional verification]

  - id: bias_analysis
    title: "Bias Analysis"
    instruction: "Identify and assess potential biases in the source"
    sections:
      - id: bias_identification
        title: "Bias Identification"
        template: |
          **Selection Bias:** [Bias in selection of information or examples]
          **Confirmation Bias:** [Tendency to favor supporting evidence]
          **Cultural Bias:** [Cultural or geographic perspectives that may limit objectivity]
          **Temporal Bias:** [Bias related to time period or historical context]
          **Professional Bias:** [Bias related to professional interests or loyalties]

      - id: bias_impact
        title: "Bias Impact Assessment"
        template: |
          **Objectivity Level:** [Overall level of objectivity maintained]
          **Balance Assessment:** [Whether multiple perspectives are considered]
          **Transparency:** [How transparent the source is about potential biases]
          **Mitigation Efforts:** [Efforts made to mitigate or acknowledge bias]
          **Impact on Reliability:** [How bias affects overall reliability of information]

  - id: contextual_factors
    title: "Contextual Factors"
    instruction: "Consider contextual factors that affect source evaluation"
    sections:
      - id: situational_context
        title: "Situational Context"
        template: |
          **Publication Context:** [Circumstances surrounding publication]
          **Political Climate:** [Political context that might affect content]
          **Economic Factors:** [Economic conditions affecting perspective]
          **Social Context:** [Social factors influencing content or reception]
          **Technological Constraints:** [Technical limitations affecting quality or scope]

      - id: access_limitations
        title: "Access and Information Limitations"
        template: |
          **Information Access:** [Author's access to relevant information]
          **Resource Constraints:** [Financial or technical resource limitations]
          **Time Constraints:** [Time pressure affecting thoroughness]
          **Legal Restrictions:** [Legal limitations on information disclosure]
          **Ethical Considerations:** [Ethical constraints on information gathering or disclosure]

  - id: verification_assessment
    title: "Verification and Cross-Reference"
    instruction: "Assess how well the source can be verified and corroborated"
    sections:
      - id: verifiability
        title: "Verifiability"
        template: |
          **Source Citations:** [Quality and accessibility of cited sources]
          **Independent Verification:** [How easily claims can be independently verified]
          **Primary Source Access:** [Access to underlying primary sources]
          **Documentation Quality:** [Quality of supporting documentation]
          **Transparency Level:** [Level of transparency in methodology and sources]

      - id: corroboration_status
        title: "Corroboration Status"
        template: |
          **Supporting Sources:** [Other sources that support key claims]
          **Contradicting Sources:** [Sources that contradict or challenge claims]
          **Expert Opinion:** [Expert opinion on the source and its claims]
          **Replication Status:** [Whether findings have been replicated by others]
          **Consensus Level:** [Level of agreement among experts in the field]

  - id: usage_recommendations
    title: "Usage Recommendations"
    instruction: "Provide specific recommendations for how this source should be used"
    sections:
      - id: reliability_rating
        title: "Overall Reliability Rating"
        template: |
          **Reliability Level:** [High/Moderate/Low with specific justification]
          **Confidence Level:** [Confidence in this assessment]
          **Key Strengths:** [Most important reliability strengths]
          **Key Limitations:** [Most important limitations or concerns]
          **Context Dependencies:** [Contexts where reliability might vary]

      - id: usage_guidelines
        title: "Usage Guidelines"
        template: |
          **Appropriate Uses:** [How this source can appropriately be used]
          **Usage Limitations:** [How this source should not be used]
          **Verification Requirements:** [What should be independently verified]
          **Supplementary Sources:** [What additional sources should be consulted]
          **Caution Areas:** [Specific areas requiring extra caution or verification]

      - id: integration_strategy
        title: "Integration Strategy"
        template: |
          **Source Combination:** [How to combine with other sources effectively]
          **Weight Assignment:** [How much weight to give this source relative to others]
          **Quality Control:** [Quality control measures when using this source]
          **Update Monitoring:** [How to monitor for updates or corrections]
          **Citation Practices:** [How to cite this source appropriately]

  - id: documentation_requirements
    title: "Documentation Requirements"
    instruction: "Ensure all documentation standards are met"
    sections:
      - id: requirements_checklist
        title: "Requirements Checklist"
        template: |
          - [ ] **Complete source information**: Full bibliographic information recorded
          - [ ] **Analysis methodology**: Clear documentation of analysis approach
          - [ ] **Evidence compilation**: Supporting evidence organized and referenced
          - [ ] **Assessment rationale**: Clear reasoning for reliability assessments
          - [ ] **Usage tracking**: Record of how source was ultimately used
