  {{trend_reversals}}
  {{/if}}
  
  {{#if discontinuities}}
  ### Discontinuities
  {{discontinuities}}
  {{/if}}
  
  ## Comparative Analysis
  
  {{#if peer_comparisons}}
  ### Peer Comparisons
  {{peer_comparisons}}
  {{/if}}
  
  {{#if industry_benchmarks}}
  ### Industry Benchmarks
  {{industry_benchmarks}}
  {{/if}}
  
  {{#if geographic_variations}}
  ### Geographic Variations
  {{geographic_variations}}
  {{/if}}
  
  {{#if temporal_comparisons}}
