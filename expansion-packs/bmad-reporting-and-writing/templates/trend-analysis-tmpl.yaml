name: Trend Analysis Template
description: Template for analyzing patterns, trajectories, and evolutionary changes over time in subjects, topics, or phenomena
version: 1.0.0
author: BMAD Reporting & Writing
created: 2025-09-02
tags: [trends, analysis, patterns, forecasting]

workflow:
  mode: trend_analysis
  sections:
    - name: executive_summary
      title: Executive Summary
      description: Overview of key trends and their significance
      variables:
        - name: analysis_subject
          type: text
          required: true
          description: Subject or phenomenon being analyzed for trends
        - name: analysis_period
          type: text
          required: true
          description: Time period covered by the trend analysis
        - name: key_trends_summary
          type: textarea
          required: true
          description: Brief summary of the most significant trends identified
        - name: trend_significance
          type: textarea
          required: true
          description: Why these trends matter and their potential impact
        - name: confidence_level
          type: text
          required: true
          description: Overall confidence level in trend analysis findings

    - name: methodology
      title: Analysis Methodology
      description: Methods and data sources used for trend identification
      variables:
        - name: data_sources
          type: textarea
          required: true
          description: Primary and secondary data sources used
        - name: analysis_methods
          type: textarea
          required: true
          description: Statistical or analytical methods employed
        - name: time_period_selection
          type: text
          required: true
          description: Rationale for time period chosen for analysis
        - name: measurement_criteria
          type: textarea
          required: true
          description: Criteria and metrics used to identify and measure trends
        - name: methodology_limitations
          type: textarea
          required: true
          description: Known limitations or constraints in the analysis approach

    - name: baseline_establishment
      title: Baseline and Historical Context
      description: Foundation period and historical reference points
      variables:
        - name: baseline_period
          type: text
          required: true
          description: Time period used as baseline for comparison
        - name: baseline_conditions
          type: textarea
          required: true
          description: Key characteristics and conditions during baseline period
        - name: historical_precedents
          type: textarea
          required: false
          description: Historical precedents or similar patterns from earlier periods
        - name: contextual_factors
          type: textarea
          required: true
          description: Important contextual factors affecting the baseline period

    - name: primary_trends
      title: Primary Trends Identified
      description: Main directional patterns and their characteristics
      variables:
        - name: trend_one
          type: textarea
          required: true
          description: First major trend identified, including direction and strength
        - name: trend_one_evidence
          type: textarea
          required: true
          description: Evidence supporting this trend
        - name: trend_two
          type: textarea
          required: false
          description: Second major trend identified, including direction and strength
        - name: trend_two_evidence
          type: textarea
          required: false
          description: Evidence supporting this trend
        - name: trend_three
          type: textarea
          required: false
          description: Third major trend identified, including direction and strength
        - name: trend_three_evidence
          type: textarea
          required: false
          description: Evidence supporting this trend

    - name: trend_dynamics
      title: Trend Dynamics and Relationships
      description: How trends interact, accelerate, or influence each other
      variables:
        - name: trend_interactions
          type: textarea
          required: true
          description: How identified trends interact with or influence each other
        - name: acceleration_factors
          type: textarea
          required: true
          description: Factors that accelerate or amplify the trends
        - name: deceleration_factors
          type: textarea
          required: true
          description: Factors that slow down or counteract the trends
        - name: cyclical_patterns
          type: textarea
          required: false
          description: Cyclical or seasonal patterns observed within the trends

    - name: driving_forces
      title: Driving Forces and Influences
      description: Underlying causes and factors driving the observed trends
      variables:
        - name: primary_drivers
          type: textarea
          required: true
          description: Main forces or factors driving the trends
        - name: secondary_influences
          type: textarea
          required: false
          description: Additional factors contributing to trend development
        - name: external_forces
          type: textarea
          required: true
          description: External events or conditions influencing the trends
        - name: internal_dynamics
          type: textarea
          required: true
          description: Internal factors or feedback loops affecting trend evolution

    - name: quantitative_analysis
      title: Quantitative Analysis
      description: Statistical measures and numerical trend characterization
      variables:
        - name: rate_of_change
          type: textarea
          required: true
          description: Quantification of trend speed and rate of change
        - name: statistical_significance
          type: text
          required: true
          description: Statistical significance of observed trends
        - name: correlation_analysis
          type: textarea
          required: false
          description: Correlations between different variables or trends
        - name: variability_measures
          type: textarea
          required: true
          description: Measures of trend consistency or variability over time

    - name: inflection_points
      title: Inflection Points and Discontinuities
      description: Points where trends changed direction or intensity
      variables:
        - name: major_inflections
          type: textarea
          required: true
          description: Significant points where trends changed direction or speed
        - name: inflection_causes
          type: textarea
          required: true
          description: Events or factors that caused these inflection points
        - name: trend_reversals
          type: textarea
          required: false
          description: Points where trends reversed direction entirely
        - name: discontinuities
          type: textarea
          required: false
          description: Sudden breaks or discontinuities in trend patterns

    - name: comparative_analysis
      title: Comparative Analysis
      description: How these trends compare to similar patterns elsewhere
      variables:
        - name: peer_comparisons
          type: textarea
          required: false
          description: Comparison with similar entities or contexts
        - name: industry_benchmarks
          type: textarea
          required: false
          description: How trends compare to industry or sector benchmarks
        - name: geographic_variations
          type: textarea
          required: false
          description: Geographic or regional variations in trend patterns
        - name: temporal_comparisons
          type: textarea
          required: false
          description: Comparison with trends from different time periods

    - name: future_projections
      title: Future Projections
      description: Potential future development of trends
      variables:
        - name: short_term_projection
          type: textarea
          required: true
          description: Projected trend development over next 6-12 months
        - name: medium_term_projection
          type: textarea
          required: true
          description: Projected trend development over next 1-3 years
        - name: long_term_projection
          type: textarea
          required: false
          description: Projected trend development over next 5+ years
        - name: projection_confidence
          type: text
          required: true
          description: Confidence level in future projections
        - name: key_uncertainties
          type: textarea
          required: true
          description: Major uncertainties that could affect future projections

    - name: implications_recommendations
      title: Implications and Recommendations
      description: What the trends mean and suggested actions
      variables:
        - name: strategic_implications
          type: textarea
          required: true
          description: Strategic implications of the identified trends
        - name: risk_assessment
          type: textarea
          required: true
          description: Risks associated with continuing current trends
        - name: opportunity_identification
          type: textarea
          required: true
          description: Opportunities created by trend developments
        - name: action_recommendations
          type: textarea
          required: true
          description: Recommended actions based on trend analysis

output_format: |
