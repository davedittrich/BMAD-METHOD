# Social Media Content Series Workflow
# Creating cohesive multi-platform content series with consistent messaging

name: Social Media Content Series
description: Develop coordinated content series across multiple social platforms with consistent messaging and optimized engagement
agents:
  - research-strategist
  - script-writer
  - platform-specialist
  - audience-optimizer
  - content-strategist
complexity: medium
estimated_time: 1-3 days

phases:
  strategy:
    description: Series planning and content strategy
    steps:
      - step: series_planning
        agent: content-strategist
        action: plan series theme, messaging, and platform distribution
        deliverables:
          - Series theme defined
          - Key messages identified
          - Platform distribution strategy
          - Content calendar outlined
        transitions:
          next: research_and_development

  development:
    description: Content research and development
    steps:
      - step: research_and_development
        agent: research-strategist
        action: gather information and supporting content
        deliverables:
          - Supporting research compiled
          - Key statistics and facts gathered
          - Visual content opportunities identified
        transitions:
          next: content_creation

  creation:
    description: Multi-platform content creation
    steps:
      - step: content_creation
        agent: script-writer
        action: create platform-specific content variants
        deliverables:
          - Twitter/X thread created
          - Instagram post copy written
          - YouTube Shorts script developed
          - TikTok script optimized
          - LinkedIn post adapted for professional audience
        transitions:
          next: platform_optimization

  optimization:
    description: Platform-specific optimization
    steps:
      - step: platform_optimization
        agent: platform-specialist
        action: optimize each piece for its platform
        deliverables:
          - Hashtags researched and selected
          - Posting times optimized
          - Platform-specific formatting applied
          - Cross-promotion strategy planned
        transitions:
          next: audience_targeting

      - step: audience_targeting
        agent: audience-optimizer
        action: tailor content for audience engagement
        deliverables:
          - Engagement hooks optimized
          - Call-to-actions tailored per platform
          - Community interaction prompts added
        transitions:
          next: complete

series_types:
  educational:
    goal: teach complex topic across multiple posts
    structure: progressive learning with each post building on previous

  storytelling:
    goal: tell complete story in episodic format
    structure: narrative arc with cliffhangers and resolution

  behind_the_scenes:
    goal: show process or journey
    structure: chronological documentation with insights

  debate_response:
    goal: address multiple aspects of controversial topic
    structure: fair examination of different perspectives

platform_considerations:
  twitter:
    format: thread or single posts
    optimization: trending hashtags, engagement timing
    character_limits: consider thread vs single post

  instagram:
    format: carousel, stories, reels
    optimization: visual appeal, story highlights
    engagement: polls, questions in stories

  youtube_shorts:
    format: vertical video script
    optimization: strong hook, trending sounds
    retention: fast pacing, visual variety

  tiktok:
    format: short vertical video
    optimization: trending sounds, hashtag challenges
    engagement: duets, comments engagement

  linkedin:
    format: professional long-form post
    optimization: industry relevance, professional tone
    engagement: thought leadership, industry insights

completion_criteria:
  - Consistent messaging across all platforms
  - Platform-specific optimization completed
  - Engagement strategies tailored per platform
  - Content calendar with posting schedule
  - Cross-promotion plan established
  - Brand voice maintained throughout series
